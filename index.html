<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Karimi's</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f0f10;--panel:#19191b;--line:#2e2e31;--paper:#f3eee5;--mut:#9a958c;--red:#e3141c;--kraft:#b98f5e;--ok:#3fbf6f;--warn:#e9a23b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:Barlow,system-ui,sans-serif;color:var(--paper);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;color:inherit}
.dsp{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-style:italic;font-weight:900;text-transform:uppercase;letter-spacing:.005em}
.btn{border:1px solid transparent;border-radius:6px;padding:12px 20px;font:600 15px Barlow,sans-serif;cursor:pointer;background:var(--red);color:#fff}
.btn:hover{background:#c91017}
.btn.sec{background:transparent;border-color:#5b5a57;color:var(--paper)}
.btn.sec:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:default}

#title{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;padding:22px clamp(18px,4.5vw,64px) 30px;background:linear-gradient(90deg,rgba(15,15,16,.96) 0,rgba(15,15,16,.9) 34%,rgba(15,15,16,0) 66%)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px}
.nav canvas{width:200px;height:auto;display:block}
.nav nav{display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end}
.nav nav button{background:none;border:0;font:600 14px Barlow,system-ui,sans-serif;padding:8px 12px;border-radius:6px;cursor:pointer;color:#d8d3ca}
.nav nav button:hover{color:#fff;background:rgba(255,255,255,.08)}
.hero{margin:auto 0;max-width:600px;padding-top:10px}
.hero h1{margin:0 0 14px;font-size:clamp(40px,5.6vw,78px);line-height:.92}
.hero h1 span{color:var(--red)}
.hero p{margin:0 0 24px;font-size:17px;line-height:1.5;color:#d2ccc2;max-width:470px}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.facts{display:flex;gap:28px;flex-wrap:wrap;margin-top:34px;font-size:13px;color:var(--mut)}
.facts b{display:block;font:700 22px "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:var(--paper);letter-spacing:.01em}

#sheet{position:fixed;inset:0;z-index:30;background:var(--ink);display:flex;flex-direction:column}
#sheet header{display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,40px);border-bottom:1px solid var(--line);flex:none}
#sheet header h2{margin:0;font-size:30px;line-height:1}
#shBody{overflow:auto;flex:1;padding:28px clamp(16px,4vw,40px) 70px;-webkit-user-select:text;user-select:text}
.page{max-width:900px;margin:0 auto}
.page.wide{max-width:1180px}
.page h3{font:700 24px "Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;letter-spacing:.02em;margin:38px 0 10px;padding-top:14px;border-top:2px solid var(--red);display:flex;gap:12px;align-items:baseline}
.page h3 i{font-style:normal;color:var(--red)}
.page h3:first-child{margin-top:0}
.page h4{font:700 15px Barlow,system-ui,sans-serif;margin:20px 0 6px;color:#fff}
.page p,.page li{font-size:15.5px;line-height:1.6;color:#d6d0c6}
.page p{margin:0 0 10px}
.page ul{margin:0 0 10px;padding-left:20px}
.page a{color:#ff8a8f}
.lead{font-size:19px!important;line-height:1.5!important;color:var(--paper)!important}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px 28px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:14px 0}
.kv div{background:var(--ink);padding:12px 14px}
.kv b{display:block;font:700 26px "Barlow Condensed","Arial Narrow",Arial,sans-serif;color:#fff}
.kv span{font-size:12.5px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0 14px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font:600 12px Barlow,system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
tr.sum td{font-weight:700;color:#fff;border-top:1px solid #6a6964}
.good{color:var(--ok)}.warn{color:var(--warn)}.bad{color:#ff6a6a}
.note{font-size:13px!important;color:var(--mut)!important}
input[type=range]{width:100%;accent-color:var(--red)}
.ctl label{display:flex;justify-content:space-between;font:600 13px Barlow,system-ui,sans-serif;margin:14px 0 2px;color:#d6d0c6}
.ctl label b{color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{background:transparent;border:1px solid #4a4946;border-radius:6px;padding:6px 11px;font:600 13px Barlow,system-ui,sans-serif;cursor:pointer;color:#d6d0c6}
.seg button.on{background:var(--paper);border-color:var(--paper);color:#111}
.studio{display:grid;grid-template-columns:300px 1fr;gap:30px;align-items:start}
@media(max-width:820px){.studio{grid-template-columns:1fr}}
.menu{background:var(--paper);color:#161514;padding:30px clamp(18px,4vw,44px);border-radius:4px}
.menu h3{border-top-color:#161514;color:#161514}
.menu .it{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid #d9d2c5;font-size:16px}
.menu .it b{font-weight:700}.menu .it small{display:block;font-size:13px;color:#6b655c;font-weight:400}
.menu .it span{font:700 17px "Barlow Condensed","Arial Narrow",Arial,sans-serif;white-space:nowrap}
.menu p{color:#3a3732}
.pk{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.pk figure{margin:0;font-size:12px;color:#6b655c}
.pk canvas{height:92px;width:auto;display:block;margin-bottom:4px;background:#111}
kbd{background:#242426;border:1px solid #4a4946;border-radius:4px;padding:1px 6px;font:600 12px ui-monospace,monospace;color:#fff}

#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.pnl{position:absolute;background:rgba(18,18,19,.92);border:1px solid #333336;border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.5}
#tag{top:10px;left:10px;padding:8px 12px}
#tag canvas{width:118px;height:auto;display:block}
#tag small{font:600 11px Barlow,system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
#simbar{top:10px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;pointer-events:auto;white-space:nowrap}
#simbar .seg{flex-wrap:nowrap}
#wacts .btn.sec,#mb button{background:rgba(18,18,19,.92)}
#simbar .clk{font:700 26px "Barlow Condensed","Arial Narrow",Arial,sans-serif;min-width:56px}
#simbar .st{display:flex;gap:14px;color:var(--mut)}#simbar .st b{color:#fff;font-weight:600}
#simbar select{background:#242426;color:#fff;border:1px solid #4a4946;border-radius:6px;padding:5px 6px;font:600 13px Barlow,system-ui,sans-serif}
#roster{top:76px;left:10px;width:214px}
#roster h5,#inv h5,#hudR h5{margin:0 0 5px;font:600 11px Barlow,system-ui,sans-serif;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
#roster .r{display:grid;grid-template-columns:1fr auto;gap:6px;padding:2px 0}#roster .r span{color:var(--mut)}
#inv{top:76px;left:10px;width:186px;font-size:12px}
#inv .ir{display:grid;grid-template-columns:78px 1fr 18px;gap:6px;align-items:center}
#inv .ib{height:5px;background:#2c2c2f}#inv .ib i{display:block;height:100%;background:var(--ok)}#inv .ib i.lo{background:var(--warn)}#inv .ib i.zz{background:var(--red)}
#hudR{top:10px;right:10px;width:262px;max-height:calc(100vh - 150px);overflow:hidden}
.tk{background:var(--paper);color:#161514;border-radius:5px;margin-top:7px;font-size:12.5px;overflow:hidden}
.tk.best{outline:2px solid var(--red)}
.tk .h{display:flex;justify-content:space-between;font-weight:700;padding:3px 8px;color:#fff;background:#2f8f58}.tk .h.a{background:#c9861c}.tk .h.r{background:#b81d1d}
.tk .b{padding:5px 8px 7px}.tk .b div{font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid #c9c2b5;border-radius:4px;padding:0 5px;margin:2px 3px 0 0;font-size:11.5px;color:#161514;background:#fff}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.chip.ok{opacity:.45;text-decoration:line-through}
#tray{position:absolute;bottom:112px;left:50%;transform:translateX(-50%);display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:86vw}
#tray .chip{font-size:13px;padding:2px 8px}
#next{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);background:var(--paper);color:#161514;font-weight:700;padding:5px 12px;border-radius:5px;font-size:13.5px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#acts{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:center}
#acts button{background:rgba(18,18,19,.94);border:1px solid var(--red);border-radius:6px;padding:9px 14px;font:600 14.5px Barlow,system-ui,sans-serif;cursor:pointer;color:#fff;white-space:nowrap}
#acts button kbd{margin-right:7px}
#wacts{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
#help{position:absolute;bottom:8px;left:10px;font-size:11.5px;color:#b8b3a9;background:rgba(15,15,16,.6);padding:4px 8px;border-radius:5px}
#toast{position:absolute;top:70px;left:50%;transform:translateX(-50%);font-weight:600;font-size:15px;padding:8px 16px;border-radius:6px;background:rgba(18,18,19,.96);border:1px solid #55544f;opacity:0;transition:opacity .2s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1}#toast.bad{border-color:var(--red)}#toast.good{border-color:var(--ok)}
#prog{position:absolute;bottom:102px;left:50%;transform:translateX(-50%);width:200px;height:6px;background:#000a}
#prog i{display:block;height:100%;width:0;background:var(--red)}
.bub{position:absolute;transform:translate(-50%,-100%);background:var(--paper);color:#161514;font:600 12.5px Barlow,system-ui,sans-serif;padding:3px 8px;border-radius:5px;white-space:nowrap;pointer-events:none}
.bub:after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-top-color:var(--paper);border-bottom:0}
#joy{position:absolute;width:110px;height:110px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06)}
#joyK{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55)}
#mb{position:absolute;right:10px;bottom:120px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
#mb button{width:52px;height:52px;border-radius:50%;background:rgba(18,18,19,.9);border:1px solid #5b5a57;font:600 12px Barlow,system-ui,sans-serif;color:#fff}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,11,.82);z-index:25;overflow:auto;padding:14px}
.card{width:min(820px,100%);max-height:96vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:20px 24px 24px}
.card h3{font:700 13px Barlow,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 0 8px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{background:transparent;border:1px solid #4a4946;border-radius:6px;padding:9px 11px;text-align:left;cursor:pointer;font:600 15px Barlow,system-ui,sans-serif;color:var(--paper)}
.opt small{display:block;font-weight:400;font-size:12.5px;color:var(--mut);margin-top:1px}
.opt.sel{border-color:var(--red);background:rgba(227,20,28,.14)}
.opt em{float:right;font-style:normal;font-weight:700}
.cart{border-top:1px solid var(--line);margin-top:16px;padding-top:10px;font-size:14.5px}
.cart div{display:flex;justify-content:space-between;padding:3px 0}
.cart a{color:#ff8a8f;margin-left:10px}
.tot{font:700 22px "Barlow Condensed","Arial Narrow",Arial,sans-serif;display:flex;justify-content:space-between;margin-top:6px}
.receipt{background:#fffdf6;color:#1a1412;width:290px;margin:12px auto;padding:16px 18px;font:500 12.5px ui-monospace,'Courier New',monospace;text-align:left}
.receipt .num{font:italic 900 64px "Barlow Condensed","Arial Narrow",Arial,sans-serif;text-align:center;line-height:1;color:var(--red);margin:4px 0}
.receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
@media(max-width:760px),(max-height:520px){
  #roster,#help,#inv{display:none}
  #simbar{left:10px;right:10px;transform:none;top:auto;bottom:70px;justify-content:space-between;gap:8px;font-size:12px}#simbar .st span:nth-child(n+3){display:none}
  #hudR{width:200px;font-size:12px}
  #title{background:linear-gradient(180deg,rgba(15,15,16,.94) 0,rgba(15,15,16,.86) 60%,rgba(15,15,16,.3) 100%)}
  .nav nav button{padding:6px 8px;font-size:13px}
  #acts{bottom:128px;right:74px;left:auto;transform:none;flex-direction:column;align-items:flex-end}#acts kbd{display:none}
  #tray{bottom:auto;top:58px;left:10px;transform:none;justify-content:flex-start;max-width:55vw}#next{bottom:auto;top:10px;left:140px;right:220px;transform:none;font-size:12px;white-space:normal}
  #wacts{bottom:16px}
  #toast{top:50px;font-size:13px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="bubs"></div>
  <div class="pnl" id="tag"><canvas id="hudLogo" width="472" height="120"></canvas><small id="modeTag"></small></div>
  <div class="pnl hidden" id="simbar"></div>
  <div class="pnl hidden" id="roster"></div>
  <div class="pnl hidden" id="inv"></div>
  <div class="pnl hidden" id="hudR"></div>
  <div id="prog" class="hidden"><i></i></div>
  <div id="next" class="hidden"></div>
  <div id="tray"></div>
  <div id="acts"></div>
  <div id="wacts" class="hidden"><button class="btn sm" data-play="customer">Walk in as a guest</button><button class="btn sm sec" data-play="crew">Work a shift</button><button class="btn sm sec" id="wMenu">Overview</button></div>
  <div id="toast"></div>
  <div id="help"></div>
  <div id="joy" class="hidden"><div id="joyK"></div></div>
  <div id="mb" class="hidden"><button id="mView">View</button><button id="mMenu">Menu</button></div>
</div>

<div id="title">
  <div class="nav"><canvas id="tLogo" width="680" height="172"></canvas>
    <nav><button data-sheet="plan">Business plan</button><button data-sheet="menu">Menu</button><button data-sheet="ops">Kitchen system</button><button data-sheet="studio">Layout studio</button><button data-sheet="how">Controls</button></nav></div>
  <section class="hero">
    <h1 class="dsp">Carved to order.<br><span>Out in three minutes.</span></h1>
    <p>Shawarma and rice platters from a kitchen you can watch. First store: Munich. The shop behind this text is running live.</p>
    <div class="cta"><button class="btn" data-play="watch">Watch the store run</button><button class="btn sec" data-play="customer">Walk in as a guest</button><button class="btn sec" data-play="crew">Work a shift</button><button class="btn sec hidden" id="resumeBtn">Resume</button></div>
    <div class="facts" id="facts"></div>
  </section>
</div>

<div id="sheet" class="hidden"><header><h2 class="dsp" id="shTitle"></h2><button class="btn sec sm" id="shClose">Close</button></header><div id="shBody"></div></div>
<div id="kiosk" class="ov hidden"><div class="card" id="kioskCard"></div></div>
<div id="end" class="ov hidden"><div class="card" id="endCard"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const lerp = (a,b,t) => a+(b-a)*t;
const eur = n => n.toFixed(2).replace('.',',')+' €';
const eur0 = n => Math.round(n).toLocaleString('de-DE')+' €';
const BRAND = "KARIMI'S";

/* ---------- menu & unit economics (Munich; prices incl. VAT; costs are planning assumptions) ---------- */
const MEATS = {
  chicken:{n:'Chicken',plat:10.9,wrap:7.5,c:2.3,wc:1.6,desc:'Garlic-lemon marinade, carved off the spit'},
  beef:   {n:'Beef',   plat:11.9,wrap:8.5,c:3.1,wc:2.2,desc:'Paprika and sumac, crisp edges'},
  lamb:   {n:'Lamb',   plat:12.9,wrap:9.2,c:3.8,wc:2.7,desc:'Slow-turned, cumin and coriander'}
};
const RICES = {
  kabuli:{n:'Kabuli Palau',c:0.9,desc:'Saffron basmati, carrot, raisins, pistachio'},
  white: {n:'White Rice',  c:0.5,desc:'Butter-glazed basmati'},
  dill:  {n:'Dill & Broad Bean',c:0.75,desc:'Baghali polo, herby and green'}
};
const SAUCES = { garlic:{n:'Garlic',d:'Creamy, no heat',col:0xf3ecd8}, herb:{n:'Herb yogurt',d:'Cool and fresh',col:0xcfe0b0}, chili:{n:'Chili',d:'Hot',col:0xc8321a} };
const SAUCE_OPTS = [['garlic','Garlic'],['herb','Herb yogurt'],['chili','Chili (hot)'],['garlic+chili','Garlic + chili'],['none','No sauce']];
const COMBO = {price:4.5,cost:1.45};
const SIDES = {fries:{price:3.9,cost:0.65},drink:{price:3.2,cost:0.9}};
const VATF=1.07, VATD=1.19;                       // food 7 %, drinks 19 %
const COMBO_NET = COMBO.price*(0.85/VATF+0.15/VATD); // flat 85/15 split allowed for combos
const TOK = {
  box:{n:'Tray',c:'#2a2a2e'}, flat:{n:'Flatbread',c:'#d9bf8a'},
  'rice:kabuli':{n:'Kabuli',c:'#e0a83c'}, 'rice:white':{n:'White rice',c:'#efeadc'}, 'rice:dill':{n:'Dill rice',c:'#9cc45a'},
  'meat:chicken':{n:'Chicken',c:'#d9a152'}, 'meat:beef':{n:'Beef',c:'#8a4226'}, 'meat:lamb':{n:'Lamb',c:'#a05a34'},
  salad:{n:'Salad',c:'#5aa53a'}, 'sauce:garlic':{n:'Garlic sauce',c:'#f3ecd8'}, 'sauce:herb':{n:'Herb sauce',c:'#cfe0b0'}, 'sauce:chili':{n:'Chili sauce',c:'#c8321a'},
  lid:{n:'Lid',c:'#9fb4c4'}, paper:{n:'K-paper wrap',c:'#1a1a1c'}, fries:{n:'Fries',c:'#e7b840'}, drink:{n:'Drink',c:'#e3141c'}
};
const TORDER = Object.keys(TOK);
const sauceToks = m => (m.sauce||'garlic').split('+').filter(s=>s!=='none').map(s=>'sauce:'+s);
function mainTokens(m){ return m.t==='platter' ? ['box','rice:'+m.rice,'meat:'+m.meat,'salad',...sauceToks(m),'lid'] : ['flat','meat:'+m.meat,'salad',...sauceToks(m),'paper']; }
function mainPrice(m){ const me=MEATS[m.meat]; return (m.t==='platter'?me.plat:me.wrap)+(m.combo?COMBO.price:0); }
function mainNet(m){ const me=MEATS[m.meat]; return (m.t==='platter'?me.plat:me.wrap)/VATF+(m.combo?COMBO_NET:0); }
function mainCost(m){ const me=MEATS[m.meat]; return (m.t==='platter' ? RICES[m.rice].c+me.c+1.1 : me.wc+0.95) + (m.combo?COMBO.cost:0); }
function mainName(m){ const me=MEATS[m.meat]; return m.t==='platter' ? `${me.n} platter, ${RICES[m.rice].n}` : `${me.n} wrap`; }
function sauceName(m){ const o=SAUCE_OPTS.find(s=>s[0]===(m.sauce||'garlic')); return o?o[1]:''; }

/* ---------- stock held ready at each station (cap) and seconds to top up one portion (rate) ---------- */

function fin(opd,rentM2,area){

  <p class="note">Every euro figure on this page is a planning assumption, not a quote. The model below recalculates when you change the two inputs that matter most. Replace the assumptions with real offers before raising money.</p>

  ${H(1,'The offer')}
  <p>One protein station and one rice station produce the whole menu. A guest makes three choices: rice, meat, sauce. That gives nine platters and three wraps from twelve stocked items, which keeps purchasing simple and waste low. Fries and a drink turn any main into a combo for ${eur(COMBO.price)}.</p>
  <p>Sauce is chosen at the kiosk: garlic, herb yogurt, chili, garlic with chili, or none. Nothing is hot unless the guest asks for it.</p>

  ${H(2,'Brand')}
  <p>Red on black, with kraft paper as the third colour. The wordmark is a heavy italic with a flame; the short form is a flame over a K, used on cups, fries cartons, wrap paper, sauce lids and the kiosk wall. Platters go out in a black tray with a clear printed lid so the food is the packaging design.</p>
  <p>The show window is the main piece of marketing. Rice pans and three turning spits sit directly behind the glass, and the waiting area faces them.</p>

  ${H(3,'Munich market')}
  <p>Munich is one of the most expensive cities in Germany for a döner: delivery data put the average at about 8.50 € in 2025, against a national average of 7.11 €. Local guides quote 8 to 10 € for a döner plate with rice or fries. ${BRAND} prices wraps from ${eur(MEATS.chicken.wrap)} and platters from ${eur(MEATS.chicken.plat)}, so wraps sit at the market and platters slightly above it. The premium has to be earned by portion, the choice of rice, and the visible kitchen.</p>
  <p>Target sites are secondary streets with heavy foot traffic near universities, offices and transit: Maxvorstadt, Schwabing, Haidhausen, and the streets around Hauptbahnhof and Ostbahnhof. Prime pedestrian-zone rents of 200 to 350 € per m² rule out Kaufingerstraße.</p>

  <p>People stay in zones so nobody crosses a colleague during the rush. One person scoops rice and slides the tray along the counter. One carves, turns round, and sets the tray on the finishing line. One adds salad and sauce, seals it, and carries it to the pass. One works fries, drinks and the pass, checks the tray against the ticket, and calls the number. A fifth person restocks and keeps the dining room clean at peak.</p>
  <p>This follows what the large chains do. McDonald's splits each sandwich between an initiator and an assembler, with fries as a separate position, and its kitchen screens show each station only its part of the order. Chipotle and Jersey Mike's run a second make-line parallel to the customer-facing one. Here the two lines are two halves of one product, not two channels.</p>
  <p>An order paid at a kiosk appears at once on the kitchen display and on the screen above each station. Tickets turn amber, then red, as they age. The guest's number moves from Preparing to Ready on the board above the hatch.</p>

  ${H(5,'Dining room')}

  ${H(6,'Team and labour rules')}
  <p>Two shifts cover 10:30 to 22:00: four people from 10:15 to 16:15 and four from 15:50 to 22:15, with a runner at lunch and at dinner. That is about ${f.hours.toFixed(0)} paid hours a day. The model uses ${WAGE} € per hour including employer contributions, on a base wage above the statutory minimum of 13.90 € (14.60 € from January 2027).</p>

  <li>Everyone who handles food needs the health-office instruction under §43 of the Infection Protection Act before their first shift.</li></ul>

  <li><b>No alcohol at launch.</b> A restaurant licence is only required when alcohol is served. Skipping it removes the licence, the IHK course and several weeks from the timeline.</li>
  <li><b>Building use.</b> The Lokalbaukommission has to approve the premises for restaurant use. Check this before signing a lease; extraction for three spits and two fryers is the expensive part.</li>
  <li><b>VAT.</b> Since 1 January 2026 all food is taxed at 7 %, eaten in or taken away. Drinks stay at 19 %. A combo is split, and a flat 15 % drink share is accepted.</li>

  <div id="finT"></div>

  ${H(9,'Opening budget')}

  ${H(10,'Timeline')}

  ${H(11,'Risks')}

  <li><b>Price resistance.</b> Munich operators report that guests resist döner prices much above seven euros. Test platter pricing in the soft opening.</li>
  <li><b>Extraction.</b> Landlords and neighbours object to grill exhaust. Get the ventilation concept approved before paying for design.</li>

  ${H(12,'Sources')}

  s+=R(g.DOOR_IN-1.5,zf-0.1,3,0.3,'#3fbf6f',0)+T(g.DOOR_IN,zf+0.7,'IN','#3fbf6f',9)+R(g.DOOR_OUT-1.5,zf-0.1,3,0.3,'#9a958c',0)+T(g.DOOR_OUT,zf+0.7,'OUT','#9a958c',9);

function opsHTML(){ return `<div class="page"><p class="lead">Two lines, four zones, one screen system. The plan below is the store you see in 3D.</p>${blueprintSVG(PLAN)}
  <h3><i>01</i>Who stands where</h3><table><tr><th>Position</th><th>Zone</th><th>Does</th></tr><tr><td>Rice</td><td>Show line, left</td><td>Takes a tray, scoops rice, slides it to carving</td></tr><tr><td>Carving</td><td>Show line, centre</td><td>Carves to order, turns and hands the tray to the finishing line</td></tr><tr><td>Finishing</td><td>Back wall</td><td>Salad, the sauce the guest chose, lid or wrap paper, walks it to the pass</td></tr><tr><td>Expo</td><td>By the hatch</td><td>Fries and drinks, checks the tray against the ticket, calls the number</td></tr><tr><td>Runner</td><td>Lane and dining room</td><td>Restocks the lowest station, wipes tables, empties bins</td></tr></table>
  <h3><i>02</i>How an order moves</h3><p>Kiosk payment creates a ticket. The kitchen display shows every open ticket; each station screen shows only the tickets that need that station, oldest first, with the stock level of that station. Tickets go amber at half the target time and red at three quarters. When expo calls the number it moves to Ready on the guest board.</p>
  <h3><i>03</i>Why two lines</h3><p>A single 20 m line means one cook walks its length for every tray and five people share one strip of floor. Splitting it puts the two things guests should see at the glass, shortens the walk to a turn-around, and gives each person a zone. The floor is marked: white boxes are standing positions on the show line, grey on the finishing line, yellow lines edge the lane, and the hatched box is the hand-off.</p>
  <h3><i>04</i>Stock at the stations</h3><p>Each station holds a set number of ready portions, shown by the real level of the rice pan, the size of the spit and the height of the stacks. The runner tops up whichever station is lowest.</p></div>`; }
function howHTML(){ return `<div class="page"><h3><i>01</i>Keyboard and mouse</h3><p><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> move, <kbd>Shift</kbd> run. Hold either mouse button and drag to look. Scroll to zoom. <kbd>V</kbd> switches between first and third person. <kbd>E</kbd> <kbd>F</kbd> <kbd>G</kbd> are the actions shown at the bottom of the screen. <kbd>P</kbd> pauses.</p>

  <div class="seg" id="stPre">${Object.keys(PRESETS).map(k=>`<button data-pre="${k}">${PRESETS[k].n}</button>`).join('')}</div>

function bindStudio(){ const sync=()=>{ $('sW').value=studio.W; $('sD').value=studio.D; $('sO').value=studio.oph; $('sT').checked=studio.takeaway; };

let AC=null;
function beep(f,d,type,v,delay){ if(!playing||(G&&G.speed>1)) return; try{ if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)(); const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f; const t=AC.currentTime+(delay||0); g.gain.setValueAtTime(v||.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }catch(_){} }
let wasLand=null;

addEventListener('resize',resize); resize();
const clock=new THREE.Clock(); let hudAcc=0,scrAcc=0,frame=0,perfAcc=0,perfN=0,shadowEvery=3,started=false;
function boot(){ if(started) return; started=true; regLogo($('tLogo'),null,.7); regLogo($('hudLogo'),null,.7); buildWorld(); newSim('sim',705); setCutaway(true); refreshFacts(); tick(); }
function tick(){
  requestAnimationFrame(tick);
  const raw=clock.getDelta(), dt=Math.min(raw,0.05); time+=dt; frame++;
  // keep it sharp: resolution stays native; when frames get slow, shadows update less often and only then the resolution steps down a little
  perfAcc+=raw; perfN++; if(perfAcc>2){ const ms=perfAcc/perfN*1000; perfAcc=0; perfN=0; if(ms>30){ if(shadowEvery<12) shadowEvery*=2; else if(DPR>1){ DPR=Math.max(1,DPR-0.25); renderer.setPixelRatio(DPR); resize(); } } }
  spinners.forEach((s,i)=>{ s.rotation.y+=dt*(0.8+i*0.05); });
  flickers.forEach((f,i)=>{ f.material.emissiveIntensity=1.3+0.45*Math.sin(time*9+i*2)+0.2*Math.sin(time*23+i); });
  bubbles.forEach((b,i)=>{ b.position.y=1.46+0.012*Math.sin(time*14+i*3); });
  if(G&&(!paused||G.mode!=='crew')&&!G.ended&&!(uiOpen&&G.mode==='crew')){ const sp=playing?G.speed:1; let rem=dt*sp; while(rem>1e-5){ const h=Math.min(0.05,rem); updateSim(h); rem-=h; } }
  scrAcc+=dt; if(scrAcc>.5||labelsDirty){ scrAcc=0; labelsDirty=false; drawDisplay(); drawKDS(); drawStationScreens(); KIOSKS.forEach((k,i)=>drawKiosk(i)); }
  if(frame%shadowEvery===0) renderer.shadowMap.needsUpdate=true;
  const land=!playing||paused; if(land!==wasLand){ wasLand=land; if(land&&innerWidth>760) camera.setViewOffset(innerWidth,innerHeight,-innerWidth*0.2,-innerHeight*0.04,innerWidth,innerHeight); else camera.clearViewOffset(); }
  if(land){ updateWatch(dt,true); renderer.render(scene,camera); return; }
  if(view==='watch') updateWatch(dt,false);
  else { if(!document.hasFocus()) clearKeys(); updatePlayer(dt);
    if(G.mode==='customer'&&player.eating){ player.eatT+=dt; setProg(player.eatT/7); if(player.eatT>=7) finishMeal(); }
    if(G.mode==='crew'&&G.clockedIn&&!G.ended){ if(!G.rushed&&G.t-G.t0>150){ G.rushed=true; toast('Lunch rush: tickets are coming faster',''); } if(G.t-G.t0>=G.shift) endShift(); } }
  hudAcc+=dt; if(hudAcc>0.25){ hudAcc=0; renderHUD(); }
  updateBubbles();
  if(toastT>0){ toastT-=dt; if(toastT<=0) $('toast').className=''; }
  renderer.render(scene,camera);
}
